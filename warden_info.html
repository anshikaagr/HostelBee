<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warden Info - HostelBee</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:linear-gradient(135deg,#f3effc,#f7f5ff);
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
background:white;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.logo{
font-size:24px;
font-weight:600;
}

.logo span{
color:#8c7cf6;
}

.back-btn{
border:1px solid #cfc8ff;
padding:10px 18px;
border-radius:25px;
color:#7c6cf2;
text-decoration:none;
}

/* CONTAINER */

.container{
max-width:900px;
margin:50px auto;
padding:20px;
}

.title{
font-size:26px;
margin-bottom:20px;
}

/* CARD */

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
margin-bottom:20px;
display:flex;
align-items:center;
justify-content:space-between;
}

/* LEFT SIDE */

.info{
display:flex;
align-items:center;
gap:15px;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
background:#e4e0ff;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
color:#6c5ce7;
}

.details h3{
font-size:18px;
margin-bottom:4px;
}

.phone{
font-size:14px;
color:#666;
}

/* STATUS */

.status{
font-size:13px;
padding:6px 12px;
border-radius:20px;
display:inline-block;
}

.available{
background:#c6f7dc;
color:#0a7a3f;
}

.busy{
background:#ffe5a4;
color:#8a6d00;
}

/* BUTTON */

.call-btn{
display:inline-block;
margin-top:10px;
background:linear-gradient(135deg,#8c7cf6,#a594ff);
color:white;
padding:8px 16px;
border-radius:25px;
text-decoration:none;
font-size:14px;
}

</style>
</head>

<body>

<nav class="navbar">
<div class="logo">Hostel<span>Bee</span></div>

<a href="student.html" class="back-btn">
← Back
</a>
</nav>

</div>
</div>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
